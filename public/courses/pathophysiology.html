<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NursePrep"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/icon-192.png"><title>Pathophysiology • NursePrep</title><link rel="stylesheet" href="../assets/styles.css"><script src="../assets/common.js"></script></head><body><div class="shell"><header class="top"><a class="brand" href="../index.html"><div class="logo">NP</div><div><h1>NursePrep</h1></div></a><nav class="nav"><a class="" href="../index.html">Home</a><a class="active" href="../courses.html">Courses</a><a class="" href="../scanner.html">Scanner</a></nav></header><div class="row"><div><span class="pill">NURS 302</span><h2 style="font-size:34px;margin:8px 0">Pathophysiology</h2><p class="muted">Foundational Sciences</p></div><div class="status"><span id="statusDot" class="dot"></span><span id="statusText" class="muted">Checking syllabus…</span></div></div><div class="two">
<section class="panel"><h2>Course syllabus</h2><p class="muted">This is the only source NursePrep may use for this course.</p><div class="form"><input id="file" type="file" accept=".pdf,.txt,.md,.csv,image/*"><textarea id="syllabusText" rows="12" placeholder="Or paste syllabus, units, objectives, study guide, or topic list…"></textarea><button id="saveBtn" class="primary" onclick="saveSyllabus()">Analyze & save syllabus</button><button class="danger" onclick="clearSyllabus()">Clear saved syllabus</button></div><div id="profileBox" style="margin-top:12px"></div></section>
<section class="panel"><h2>Free-response practice</h2><div id="locked" class="notice">Add a syllabus first. No syllabus = no generated questions.</div><div id="practice" class="hide"><div class="row"><select id="difficulty" style="max-width:170px"><option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option></select><button id="genBtn" class="primary" onclick="newProblem()">Generate problem</button></div><div id="problemWrap" class="hide"><span id="problemMeta" class="pill" style="margin-top:17px"></span><div id="problem" class="problem"></div><textarea id="answer" class="answer" placeholder="Work the problem and type your final answer or reasoning here…"></textarea><div class="row" style="margin-top:10px"><button class="ghost" onclick="showHint()">Show hint</button><button id="checkBtn" class="primary" onclick="checkAnswer()">Check answer</button><button class="ghost" onclick="openScanner()">Scan handwritten work</button></div><div id="hintBox" class="box"></div><div id="feedback" class="box"></div></div></div></section></div><script>const COURSE={"slug":"pathophysiology","name":"Pathophysiology","code":"NURS 302","group":"Foundational Sciences"};</script><script>
const PROFILE_KEY='ef_profile_'+COURSE.slug,SESSION_KEY='ef_session_'+COURSE.slug,FOCUS_KEY='ef_focus_'+COURSE.slug;
let profile=null,currentProblem=null;
function saveSession(){localStorage.setItem(SESSION_KEY,JSON.stringify({problem:currentProblem,answer:document.getElementById('answer')?.value||'',difficulty:document.getElementById('difficulty')?.value||'Mixed',savedAt:new Date().toISOString()}))}
function load(){try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')}catch(e){}renderProfile();try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(s?.problem){currentProblem=s.problem;showProblem();document.getElementById('answer').value=s.answer||'';document.getElementById('difficulty').value=s.difficulty||'Mixed'}}catch(e){}}
function syllabusChapters(){if(Array.isArray(profile?.chapters)&&profile.chapters.length)return profile.chapters.filter(x=>x?.name);if(profile?.topics?.length)return[{name:'Imported topics — re-analyze to organize by chapter',topics:profile.topics}];return[]}
function selectedTopics(){try{return JSON.parse(localStorage.getItem(FOCUS_KEY)||'[]')}catch(e){return[]}}
function saveTopicSelection(){const selected=[...document.querySelectorAll('.topic-choice:checked')].map(x=>x.dataset.topic);localStorage.setItem(FOCUS_KEY,JSON.stringify(selected))}
function renderProfile(){
 const dot=document.getElementById('statusDot'),txt=document.getElementById('statusText'),locked=document.getElementById('locked'),practice=document.getElementById('practice'),box=document.getElementById('profileBox');
 if(!profile){dot.classList.remove('on');txt.textContent='No syllabus saved';locked.classList.remove('hide');practice.classList.add('hide');box.innerHTML='<p class="muted">Add course material to unlock practice.</p>';return}
 dot.classList.add('on');txt.textContent='Syllabus ready';locked.classList.add('hide');practice.classList.remove('hide');const selected=new Set(selectedTopics()),chapters=syllabusChapters();
 const chapterHtml=chapters.map(chapter=>`<div class="chapter-select"><b>${escapeHtml(chapter.name)}</b><div class="topic-options">${(chapter.topics||[]).map(topic=>`<label class="topic-toggle"><input class="topic-choice" type="checkbox" data-topic="${escapeHtml(topic)}" ${selected.has(topic)?'checked':''}> <span>${escapeHtml(topic)}</span></label>`).join('')||'<span class="muted">Use the full chapter</span>'}</div></div>`).join('');
 box.innerHTML=`<div class="notice"><b>Syllabus saved.</b><br>${escapeHtml(profile.notes||'')}</div><p class="muted" style="margin:12px 0 8px">Select topics for the next problem. Leave everything unselected to use the full syllabus.</p><div class="chapter-list">${chapterHtml||'<div class="notice">Re-analyze this syllabus to organize its topics by chapter.</div>'}</div>`;
}
async function saveSyllabus(){
 const f=document.getElementById('file').files[0],text=document.getElementById('syllabusText').value.trim();
 if(!f&&!text)return alert('Upload a syllabus or paste course material first.');
 const btn=document.getElementById('saveBtn'),old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Analyzing';
 try{
  let body={course:COURSE,text};
  if(f){body.file={name:f.name,mime_type:f.type||'application/octet-stream',data:await fileToBase64(f)}}
  const out=await api('/api/analyze-syllabus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  profile=out.profile;localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));renderProfile();
 }catch(e){alert(e.message)}finally{btn.disabled=false;btn.innerHTML=old}
}
function clearSyllabus(){if(confirm('Clear the saved syllabus for '+COURSE.name+'?')){localStorage.removeItem(PROFILE_KEY);profile=null;renderProfile()}}
async function newProblem(){
 if(!profile)return;const btn=document.getElementById('genBtn'),old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Generating';
 try{currentProblem=await api('/api/generate-problem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:COURSE,difficulty:document.getElementById('difficulty').value,profile,focus:selectedTopics()})});showProblem();saveSession()}
 catch(e){alert(e.message)}finally{btn.disabled=false;btn.innerHTML=old}
}
function showProblem(){document.getElementById('problemWrap').classList.remove('hide');document.getElementById('problemMeta').textContent=(currentProblem.topic||'Syllabus topic')+' • '+(currentProblem.difficulty||'Mixed');document.getElementById('problem').textContent=currentProblem.problem||'';document.getElementById('hintBox').className='box';document.getElementById('feedback').className='box'}
function showHint(){if(!currentProblem)return;const b=document.getElementById('hintBox');b.textContent=currentProblem.hint||'Review the syllabus concept and governing relationships.';b.classList.add('show')}
async function checkAnswer(){
 const answer=document.getElementById('answer').value.trim();if(!answer)return alert('Enter your work or final answer first.');saveSession();
 const btn=document.getElementById('checkBtn'),old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Checking';
 try{const out=await api('/api/check-answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:COURSE,profile,problem:currentProblem,answer})});const b=document.getElementById('feedback');b.className='box show '+(out.correct?'good':'bad');b.innerHTML=`<b>${out.correct?'Correct / essentially correct':'Needs revision'}</b><p>${escapeHtml(out.feedback)}</p><p><b>Correct approach:</b> ${escapeHtml(out.correct_approach)}</p>`}
 catch(e){alert(e.message)}finally{btn.disabled=false;btn.innerHTML=old}
}
function openScanner(){if(!currentProblem)return alert('Generate a problem first.');saveSession();localStorage.setItem('ef_scan_context',JSON.stringify({course:COURSE,profile,problem:currentProblem}));location.href='../scanner.html?course='+encodeURIComponent(COURSE.slug)}
document.addEventListener('input',e=>{if(e.target.id==='answer')saveSession();if(e.target.classList.contains('topic-choice'))saveTopicSelection()});load();
</script></div></body></html>
